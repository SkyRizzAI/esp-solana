[package]
name         = "esp32c3-solana-demo"
edition      = "2024"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32c3-solana-demo"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c3"] }
esp-alloc = "0.9"
esp-println = { version = "0.16", features = ["esp32c3"] }
critical-section = "1.2"

# esp-solana with wallet support (BIP39 + SLIP-10 + Ed25519 signing)
esp-solana = { path = "../..", features = ["wallet"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
