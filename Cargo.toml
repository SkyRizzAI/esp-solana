[package]
name = "esp-solana"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Compact no_std Solana SDK for ESP32 microcontrollers"
license = "MIT"
authors = ["Riz"]
repository = "https://github.com/SkyRizzAI/esp-solana"
keywords = ["solana", "esp32", "no-std", "embedded", "blockchain"]
categories = ["no-std", "embedded", "cryptography"]
readme = "README.md"
exclude = [
    "examples/",
    "docs/",
    "target/",
    ".github/",
]

[package.metadata.docs.rs]
features = ["wallet"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[dependencies]
ed25519-compact = { version = "2.1", default-features = false, optional = true }
hmac-sha256 = { version = "1.1", default-features = false, optional = true }
hmac-sha512 = { version = "1.1", default-features = false, optional = true }

[features]
default = ["crypto"]
crypto = ["dep:ed25519-compact"]
wallet = ["crypto", "dep:hmac-sha256", "dep:hmac-sha512"]
std = []

[dev-dependencies]
ureq = "2"